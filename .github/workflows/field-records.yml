name: Field records

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw plate 04
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECORDS_TOKEN: ${{ secrets.RECORDS_TOKEN }}
        run: python3 .github/scripts/field_records.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/records-light.svg assets/records-dark.svg
          git diff --cached --quiet || git commit -m "Update field records"
          git push
